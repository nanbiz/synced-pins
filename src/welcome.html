<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Zen Essentials in Chrome</title>
  <link rel="icon" href="../icons/icon-32.png">
  <link rel="stylesheet" href="welcome.css">
  <script type="module" src="welcome.js"></script>
</head>
<body>
  <main>
    <h1><img src="../icons/icon-48.png" alt="">Zen Essentials in Chrome</h1>
    <section class="row">
      <div class="what">
        <div class="name">New tab overlay</div>
        <span id="shortcut"></span>
      </div>
      <button id="change" class="quiet" type="button">Change</button>
      <button id="ctrl-t" class="primary" type="button">Use Ctrl+T</button>
      <span id="done" class="ok" hidden>✓</span>
    </section>
    <ol id="steps" hidden>
      <li>In the extensions tab press <kbd>F12</kbd> and open <b>Console</b></li>
      <li>Paste with <kbd>Ctrl</kbd> + <kbd>V</kbd> and press <kbd>Enter</kbd></li>
    </ol>
    <hr>
    <section class="row">
      <div class="what">
        <div class="name">Close other tabs</div>
        toolbar button <img class="button-icon" src="../icons/icon-16.png" alt="">
      </div>
    </section>
  </main>
</body>
</html>
