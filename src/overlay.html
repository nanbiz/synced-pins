<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>New Tab</title>
  <link rel="stylesheet" href="overlay.css">
  <link rel="modulepreload" href="match.js">
  <link rel="modulepreload" href="quick-actions.js">
  <script type="module" src="overlay.js"></script>
</head>
<body>
  <div id="box" role="dialog" aria-label="Go to">
    <div id="bar">
      <img src="search.svg" alt="">
      <input id="query" type="text" autocomplete="off" spellcheck="false" placeholder="Search or enter address" aria-label="Search or enter address" autofocus>
    </div>
    <div id="results" role="listbox"></div>
    <div id="pages" class="offer" hidden>
      <img src="layers.svg" alt="">
      <span>Open over the page instead of a tab</span>
      <button id="pages-allow" class="primary" type="button">Allow</button>
      <button id="pages-dismiss" class="dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
    <div id="history" class="offer" hidden>
      <img src="history.svg" alt="">
      <span>History and bookmarks</span>
      <button id="history-allow" class="primary" type="button">Include</button>
      <button id="history-dismiss" class="dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
    <div id="setup" class="offer" hidden>
      <img src="keyboard.svg" alt="">
      <span>Open this with <kbd>Ctrl</kbd>+<kbd>T</kbd></span>
      <button id="setup-open" class="primary" type="button">Set up</button>
      <button id="setup-dismiss" class="dismiss" type="button" aria-label="Dismiss">✕</button>
    </div>
  </div>
</body>
</html>
