name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The store refuses an upload while an earlier version is in review; the
  # daily run offers the current version again until the store has it.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  e2e:
    name: e2e (${{ matrix.browser }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome-for-testing, chromium, google-chrome, brave, edge, vivaldi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Ubuntu 24.04 forbids the unprivileged user namespaces Chrome's sandbox needs.
      - run: |
          sudo apt-get install -y xvfb
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - if: matrix.browser == 'chrome-for-testing'
        uses: browser-actions/setup-chrome@v2
        id: chrome-for-testing
      - if: matrix.browser == 'chrome-for-testing'
        run: echo "CHROME_PATH=${{ steps.chrome-for-testing.outputs.chrome-path }}" >> "$GITHUB_ENV"

      - if: matrix.browser == 'chromium'
        uses: browser-actions/setup-chrome@v2
        id: chromium
        with:
          chrome-version: latest
      - if: matrix.browser == 'chromium'
        run: echo "CHROME_PATH=${{ steps.chromium.outputs.chrome-path }}" >> "$GITHUB_ENV"

      # Branded Chrome ignores --load-extension since 137, so the suite loads
      # the extension over the DevTools protocol there.
      - if: matrix.browser == 'google-chrome'
        run: |
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          echo "CHROME_PATH=/usr/bin/google-chrome-stable" >> "$GITHUB_ENV"
          echo "SYNCED_PINS_LOAD=cdp" >> "$GITHUB_ENV"

      - if: matrix.browser == 'brave'
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update
          sudo apt-get install -y brave-browser
          echo "CHROME_PATH=/usr/bin/brave-browser-stable" >> "$GITHUB_ENV"

      - if: matrix.browser == 'edge'
        run: |
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-edge.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-edge.gpg] https://packages.microsoft.com/repos/edge stable main" | sudo tee /etc/apt/sources.list.d/microsoft-edge.list
          sudo apt-get update
          sudo apt-get install -y microsoft-edge-stable
          echo "CHROME_PATH=/usr/bin/microsoft-edge-stable" >> "$GITHUB_ENV"

      - if: matrix.browser == 'vivaldi'
        run: |
          curl -fsSL https://repo.vivaldi.com/stable/linux_signing_key.pub | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/vivaldi.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/vivaldi.gpg] https://repo.vivaldi.com/stable/deb/ stable main" | sudo tee /etc/apt/sources.list.d/vivaldi.list
          sudo apt-get update
          sudo apt-get install -y vivaldi-stable
          echo "CHROME_PATH=/usr/bin/vivaldi-stable" >> "$GITHUB_ENV"

      - run: sh scripts/test-e2e.sh
        timeout-minutes: 15

  release:
    runs-on: ubuntu-latest
    needs: e2e
    # A scheduled run tests nothing, so it releases what main already passed.
    if: >-
      always() && github.event_name != 'pull_request'
      && (needs.e2e.result == 'success' || (github.event_name == 'schedule' && needs.e2e.result == 'skipped'))
    permissions:
      contents: write
    env:
      CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A release is cut once per manifest version.
      - id: version
        run: |
          tag="v$(jq -r .version manifest.json)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
          # The version the store serves, from the update check Chromium itself
          # makes, which needs no credentials.
          published=$(curl -sS "https://clients2.google.com/service/update2/crx?response=updatecheck&acceptformat=crx2,crx3&prodversion=140.0&x=id%3D$CWS_ITEM_ID%26uc" \
            | grep -o '<updatecheck [^>]*>' | grep -o ' version="[^"]*"' | cut -d'"' -f2)
          echo "published=v$published" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
      - run: node scripts/package.js
      - if: steps.version.outputs.exists != 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" dist/*.zip --title "${{ steps.version.outputs.tag }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
      # The store takes the same zip and puts it up for review, unless it
      # already serves this version. A service account signs a JWT that Google
      # trades for an access token.
      - if: steps.version.outputs.published != steps.version.outputs.tag && env.CWS_SERVICE_ACCOUNT_KEY != ''
        run: |
          b64url() { openssl base64 -e -A | tr '+/' '-_' | tr -d '='; }
          key="$RUNNER_TEMP/cws-key.pem"
          jq -r .private_key <<<"$CWS_SERVICE_ACCOUNT_KEY" > "$key"
          now=$(date +%s)
          claims=$(jq -nc --arg iss "$(jq -r .client_email <<<"$CWS_SERVICE_ACCOUNT_KEY")" --argjson now "$now" \
            '{iss: $iss, scope: "https://www.googleapis.com/auth/chromewebstore", aud: "https://oauth2.googleapis.com/token", iat: $now, exp: ($now + 600)}')
          unsigned="$(printf '{"alg":"RS256","typ":"JWT"}' | b64url).$(printf '%s' "$claims" | b64url)"
          jwt="$unsigned.$(printf '%s' "$unsigned" | openssl dgst -sha256 -sign "$key" | b64url)"
          rm -f "$key"
          grant=$(curl -sS https://oauth2.googleapis.com/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer -d assertion="$jwt")
          token=$(jq -r '.access_token // empty' <<<"$grant")
          [ -n "$token" ] || { echo "::error::Google refused the service account key: $(jq -r '.error_description // .error // .' <<<"$grant")"; exit 1; }
          echo "::add-mask::$token"

          # Leaves the response in $body, and fails with the API's message on an HTTP error.
          api() {
            out=$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $token" "$@")
            code=${out##*$'\n'}
            body=${out%$'\n'*}
            if [ "$code" -lt 300 ]; then return; fi
            message=$(jq -r '.error.message // .' <<<"$body")
            # An earlier upload, this version's included, is still in review;
            # the next scheduled run offers this version again.
            if grep -q 'in review' <<<"$message"; then echo "::notice::Chrome Web Store: $message"; exit 0; fi
            echo "::error::Chrome Web Store: $message"; exit 1
          }
          item="https://chromewebstore.googleapis.com/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_ITEM_ID"
          upload="https://chromewebstore.googleapis.com/upload/v2/publishers/$CWS_PUBLISHER_ID/items/$CWS_ITEM_ID"

          api -X POST -T dist/*.zip "$upload:upload"
          state=$(jq -r .uploadState <<<"$body")
          for _ in $(seq 30); do
            [ "$state" = IN_PROGRESS ] || break
            sleep 10
            api "$item:fetchStatus"
            state=$(jq -r .lastAsyncUploadState <<<"$body")
          done
          [ "$state" = SUCCEEDED ] || { echo "::error::Chrome Web Store upload ended as $state: $body"; exit 1; }

          api -X POST -H 'Content-Type: application/json' -d '{}' "$item:publish"
          jq . <<<"$body"
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
